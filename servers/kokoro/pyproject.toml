# The Kokoro server's Python environment, for uv (https://docs.astral.sh/uv/).
# setup.ps1 (Windows) and setup.sh (macOS, Linux) run `uv sync --frozen`,
# which installs exactly the versions pinned in uv.lock into .venv.
[project]
name = "voicedock-kokoro"
version = "1.1.0"
description = "VoiceDock's local Kokoro-82M text-to-speech server"
requires-python = ">=3.10,<3.14"
dependencies = [
    "kokoro-onnx==0.6.1",
    "numpy>=2.0",
    "psutil>=6.0",
]

[tool.uv]
package = false
