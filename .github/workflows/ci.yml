# Tests and the extension build on every pull request and push to master:
# the extension (node --test), the Piper server contract (node --test, needs
# servers/piper dependencies) and the Kokoro server (python unittest, stdlib).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            servers/piper/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix servers/piper

      - name: Python version
        run: python3 --version

      - name: The old product name stays gone
        run: npm run check:names

      - name: Tests (extension, Piper server, Kokoro server)
        run: npm test

      - name: Build the extension and check the committed bundles are current
        run: |
          npm run build
          git diff --exit-code -- extension/dist

  # The built extension in Chromium against fake Piper and Kokoro servers on
  # 127.0.0.1:7477/7478, with screenshot baselines in light and dark at 1x
  # and 2x (e2e/__screenshots__). No real engine and no network.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the extension
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
